template: 30min_packet_drops
on: net.drops
lookup: sum -30m unaligned absolute
units: packets
every: 60s
delay: up 5m down 15m multiplier 1.5 max 1h
warn: $this > (($status >= $WARNING) ? (200) : (250))
crit: $this > (($status == $CRITICAL) ? (750) : (1000))
info: Sustained dropped network packets over 30 minutes
