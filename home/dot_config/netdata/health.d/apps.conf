alarm: apps_cpu_usage
on: apps.cpu
lookup: average -15m percentage *
units: %
every: 5m
delay: up 5m down 15m multiplier 1.5 max 1h
warn: $this > (($status >= $WARNING) ? (82) : (90))
crit: $this > (($status == $CRITICAL) ? (90) : (96))
info: Sustained 15-minute CPU utilization of applications

alarm: apps_ram_usage
on: apps.mem
lookup: average -10m percentage *
units: %
every: 5m
delay: up 5m down 15m multiplier 1.5 max 1h
warn: $this > (($status >= $WARNING) ? (84) : (88))
crit: $this > (($status == $CRITICAL) ? (91) : (95))
info: Sustained RAM utilization of applications

alarm: apps_swap_usage
on: apps.swap
lookup: average -10m percentage *
units: %
every: 5m
delay: up 5m down 15m multiplier 1.5 max 1h
warn: $this > (($status >= $WARNING) ? (80) : (85))
crit: $this > (($status == $CRITICAL) ? (90) : (94))
info: Sustained swap utilization of applications
