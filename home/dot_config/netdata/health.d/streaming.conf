template: streaming_never_connected
on: netdata.streaming_inbound_permanent
lookup: max -1m unaligned of never_connected
units: nodes
every: 10s
warn: $this > 1000000
delay: up 5m down 5m
info: Permanent inbound streaming nodes that have not connected since startup (silenced for ephemeral/migrated child nodes)
to: silent

template: streaming_disconnected
on: netdata.streaming_inbound_permanent
lookup: max -1m unaligned of disconnected
units: nodes
every: 10s
warn: $this > 1000000
delay: up 15m down 15m multiplier 1.5 max 1h
info: Permanent inbound streaming nodes currently disconnected
to: silent
