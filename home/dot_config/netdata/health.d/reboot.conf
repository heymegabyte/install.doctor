alarm: system_post_update_reboot_status
on: system.post_update_reboot_status
lookup: max -1m unaligned of required
every: 1m
warn: $this > 1000000
delay: up 7d down 5m
info: Interactive workstations defer kernel reboot to scheduled maintenance windows
to: silent

