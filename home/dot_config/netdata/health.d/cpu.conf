alarm: cpu_usage
on: system.cpu
class: Utilization
type: System
component: CPU
lookup: average -15m percentage foreach user,system
units: %
every: 5m
delay: up 5m down 15m multiplier 1.5 max 1h
warn: $this > (($status >= $WARNING) ? (82) : (92))
crit: $this > (($status == $CRITICAL) ? (90) : (97))
summary: Sustained CPU utilization
info: Sustained 15-minute CPU utilization of user or system processes
to: sysadmin

template: 10min_cpu_usage
on: system.cpu
class: Utilization
type: System
component: CPU
lookup: average -15m unaligned of user,system,softirq,irq,guest
units: %
every: 5m
delay: up 5m down 15m multiplier 1.5 max 1h
warn: $this > (($status >= $WARNING) ? (82) : (92))
crit: $this > (($status == $CRITICAL) ? (90) : (97))
summary: System CPU utilization (15m average)
info: Average CPU utilization over 15 minutes (excluding iowait/nice)
to: silent

template: ml_5min_cpu_dims
on: system.cpu
os: linux
hosts: *
lookup: average -15m anomaly-bit foreach *
calc: $this
units: %
every: 60s
delay: up 5m down 15m multiplier 1.5 max 1h
warn: $this > (($status >= $WARNING) ? (15) : (50))
crit: $this > (($status == $CRITICAL) ? (40) : (100))
info: Rolling 15 minute anomaly rate for each CPU dimension
to: silent

template: ml_5min_cpu_chart
on: system.cpu
os: linux
hosts: *
lookup: average -15m anomaly-bit of *
calc: $this
units: %
every: 60s
delay: up 5m down 15m multiplier 1.5 max 1h
warn: $this > (($status >= $WARNING) ? (15) : (50))
crit: $this > (($status == $CRITICAL) ? (40) : (100))
info: Rolling 15 minute anomaly rate for CPU chart
to: silent
