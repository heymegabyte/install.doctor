alarm: cpu_usage
on: system.cpu
os: linux
class: Utilization
type: System
component: CPU
lookup: average -15m unaligned of user,system
units: %
every: 5m
delay: up 10m down 15m multiplier 1.5 max 1h
warn: $this > (($status >= $WARNING) ? (88) : (95))
crit: $this > (($status == $CRITICAL) ? (94) : (98))
summary: Sustained CPU utilization
info: Sustained 15-minute CPU utilization of user and system processes
to: sysadmin

template: 10min_cpu_usage
on: system.cpu
os: linux
class: Utilization
type: System
component: CPU
lookup: average -15m unaligned of user,system,softirq,irq,guest
units: %
every: 5m
delay: up 10m down 15m multiplier 1.5 max 1h
warn: $this > 1000000
crit: $this > 1000000
summary: System CPU utilization (15m average)
info: Silenced duplicate of cpu_usage (disabled for both local notify and Netdata Cloud)
to: silent

template: ml_5min_cpu_dims
on: system.cpu
os: linux
hosts: *
lookup: average -15m anomaly-bit foreach *
calc: $this
units: %
every: 60s
delay: up 5m down 15m multiplier 1.5 max 1h
warn: $this > 1000000
crit: $this > 1000000
info: Rolling 15 minute anomaly rate for each CPU dimension (silenced)
to: silent

template: ml_5min_cpu_chart
on: system.cpu
os: linux
hosts: *
lookup: average -15m anomaly-bit of *
calc: $this
units: %
every: 60s
delay: up 5m down 15m multiplier 1.5 max 1h
warn: $this > 1000000
crit: $this > 1000000
info: Rolling 15 minute anomaly rate for CPU chart (silenced)
to: silent
