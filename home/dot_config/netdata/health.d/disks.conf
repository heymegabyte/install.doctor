template: disk_space_usage
on: disk.space
class: Utilization
type: System
component: Disk
chart labels: mount_point=!/Volumes/* !/System/Volumes/* !/private/tmp/* !/dev !/dev/* !/run !/run/* !/snap/* !HarddiskVolume* *
calc: $used * 100 / ($avail + $used)
units: %
every: 5m
delay: up 5m down 15m multiplier 1.5 max 1h
warn: $this > (($status >= $WARNING) ? (85) : (90))
crit: ($this > (($status == $CRITICAL) ? (91) : (95))) && $avail < 15
summary: Disk ${label:mount_point} space usage
info: Persistent primary filesystem space utilization
to: sysadmin

template: disk_full_percent
on: disk.space
calc: $used * 100 / ($avail + $used)
units: %
every: 15m
delay: up 5m down 15m multiplier 1.5 max 1h
warn: $this > (($status >= $WARNING) ? (85) : (90))
crit: $this > (($status == $CRITICAL) ? (91) : (95))
info: Silenced legacy duplicate of disk_space_usage
to: silent

template: disk_inode_usage
on: disk.inodes
class: Utilization
type: System
component: Disk
chart labels: mount_point=!/Volumes/* !/System/Volumes/* !/private/tmp/* !/dev !/dev/* !/run !/run/* !/snap/* *
calc: $used * 100 / ($avail + $used)
units: %
every: 5m
delay: up 5m down 15m multiplier 1.5 max 1h
warn: $this > (($status >= $WARNING) ? (85) : (90))
crit: $this > (($status == $CRITICAL) ? (92) : (96))
summary: Disk ${label:mount_point} inode usage
info: Persistent primary filesystem inode utilization
to: sysadmin
