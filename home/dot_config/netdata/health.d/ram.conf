alarm: ram_usage
on: system.ram
class: Utilization
type: System
component: Memory
os: macos
calc: ($active + $wired + $compressor) * 100 / ($active + $wired + $throttled + $compressor + $inactive + $purgeable + $speculative + $free)
units: %
every: 5m
delay: up 5m down 15m multiplier 1.5 max 1h
warn: $this > (($status >= $WARNING) ? (85) : (92))
crit: $this > (($status == $CRITICAL) ? (92) : (97))
summary: Non-reclaimable macOS Unified Memory utilization
info: Non-reclaimable macOS Unified Memory utilization (active + wired + compressor)
to: sysadmin

alarm: ram_usage_macos
on: system.ram
os: macos
to: silent

alarm: ram_usage
on: system.ram
class: Utilization
type: System
component: Memory
os: linux
lookup: average -10m percentage of used
units: %
every: 5m
delay: up 5m down 15m multiplier 1.5 max 1h
warn: $this > (($status >= $WARNING) ? (85) : (92))
crit: $this > (($status == $CRITICAL) ? (92) : (98))
summary: Sustained Linux RAM utilization
info: Sustained 10-minute Linux RAM utilization
to: silent

alarm: ram_in_use
on: system.ram
class: Utilization
type: System
component: Memory
os: linux
lookup: average -10m unaligned of used
calc: $this * 100 / ($this + $cached + $free + $buffers)
units: %
every: 5m
delay: up 5m down 15m multiplier 1.5 max 1h
warn: $this > (($status >= $WARNING) ? (85) : (92))
crit: $this > (($status == $CRITICAL) ? (92) : (98))
summary: System RAM utilization (10m average)
info: Sustained 10-minute system memory utilization
to: sysadmin
