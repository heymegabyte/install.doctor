alarm: ram_usage_macos
on: system.ram
os: macos
calc: ($active + $wired + $compressor) * 100 / ($active + $wired + $throttled + $compressor + $inactive + $purgeable + $speculative + $free)
units: %
every: 5m
delay: up 5m down 15m multiplier 1.5 max 1h
warn: $this > (($status >= $WARNING) ? (84) : (90))
crit: $this > (($status == $CRITICAL) ? (91) : (96))
info: Non-reclaimable macOS Unified Memory utilization

alarm: ram_usage
on: system.ram
os: linux
lookup: average -10m percentage of used
units: %
every: 5m
delay: up 5m down 15m multiplier 1.5 max 1h
warn: $this > (($status >= $WARNING) ? (84) : (90))
crit: $this > (($status == $CRITICAL) ? (91) : (96))
info: Sustained Linux RAM utilization
