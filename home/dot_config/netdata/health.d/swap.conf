alarm: used_swap
on: system.swap
lookup: average -10m percentage of used
units: %
every: 5m
delay: up 5m down 15m multiplier 1.5 max 1h
warn: $this > 85
crit: $this > 94
info: Sustained swap utilization

# NOTE: the stock netdata `30min_ram_swapped_out` alarm is a false positive on this zram-first host
# (swappiness=100 + compressed zram0 swaps anonymous pages to fast compressed RAM by design). A
# same-name override here does NOT win (netdata keeps the stock definition), so it is disabled the
# netdata-native way via `[health] enabled alarms = !30min_ram_swapped_out *` in netdata.conf —
# applied idempotently by scripts/harden-fleet.sh (§6). Keeps the fleet at zero active alarms.
