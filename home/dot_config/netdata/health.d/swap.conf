alarm: used_swap
on: mem.swap
class: Utilization
type: System
component: Memory
os: linux freebsd
lookup: average -10m unaligned of used
calc: ($used + $free) > 0 ? ($this * 100 / ($used + $free)) : 0
units: %
every: 5m
delay: up 5m down 15m multiplier 1.5 max 1h
warn: $this > (($status >= $WARNING) ? (80) : (90))
crit: $this > (($status == $CRITICAL) ? (90) : (95))
summary: System swap memory utilization
info: Sustained 10-minute swap utilization
to: sysadmin

alarm: used_swap
on: system.swap
class: Utilization
type: System
component: Memory
os: macos
lookup: average -10m percentage of used
units: %
every: 5m
delay: up 5m down 15m multiplier 1.5 max 1h
warn: $this > (($status >= $WARNING) ? (80) : (90))
crit: $this > (($status == $CRITICAL) ? (90) : (95))
summary: System swap memory utilization
info: Sustained 10-minute macOS swap utilization
to: sysadmin

alarm: 30min_ram_swapped_out
on: system.swapio
os: linux freebsd
lookup: sum -30m unaligned absolute of out
units: % of RAM
every: 5m
warn: $this > 1000000
delay: up 30m down 15m multiplier 1.5 max 1h
info: 30-minute swap-out volume (silenced on zram-backed hosts)
to: silent
