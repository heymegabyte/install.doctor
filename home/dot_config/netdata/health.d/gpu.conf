template: nvidia_gpu_temperature_high
on: nvidia_smi.gpu_temperature
class: Temperature
type: System
component: GPU
lookup: average -5m unaligned
units: celsius
every: 60s
delay: up 5m down 15m multiplier 1.5 max 1h
warn: $this > (($status >= $WARNING) ? (78) : (83))
crit: $this > (($status == $CRITICAL) ? (85) : (90))
info: Sustained NVIDIA GPU temperature is elevated
to: sysadmin

template: nvidia_gpu_memory_utilization_high
on: nvidia_smi.memory_allocated
class: Utilization
type: System
component: GPU
calc: $used * 100 / ($used + $free)
units: %
every: 60s
delay: up 5m down 15m multiplier 1.5 max 1h
warn: $this > (($status >= $WARNING) ? (85) : (92))
crit: $this > (($status == $CRITICAL) ? (92) : (97))
info: Sustained NVIDIA GPU memory allocation percentage is near capacity
to: sysadmin
