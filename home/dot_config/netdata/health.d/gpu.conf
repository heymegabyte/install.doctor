template: nvidia_gpu_temperature_high
      on: nvidia_smi.gpu_temperature
   class: Temperature
    type: System
component: GPU
 lookup: average -1m unaligned
  units: celsius
  every: 15s
   warn: $this > 80
   crit: $this > 87
   info: NVIDIA GPU temperature is elevated

template: nvidia_gpu_memory_utilization_high
      on: nvidia_smi.memory_allocated
   class: Utilization
    type: System
component: GPU
    calc: $used * 100 / ($used + $free)
   units: %
   every: 15s
    warn: $this > 88
    crit: $this > 95
    info: NVIDIA GPU memory allocation percentage is near capacity
