# Managed by install.doctor / fleet convergence
# Override stock /usr/lib/netdata/conf.d/health.d/audit.conf template
 template: audit_backlog_utilization
       on: audit.backlog_utilization
    class: Utilization
     type: System
component: Audit
   lookup: max -1m unaligned of utilization
    units: %
    every: 10s
     warn: $this > 50 AND $audit.failure.panic == 1
     crit: $this > 80 AND $audit.failure.panic == 1
    delay: down 5m multiplier 1.5 max 1h
  summary: Audit backlog utilization (kernel panic risk)
     info: Linux audit backlog is filling up while failure mode is set to panic
       to: sysadmin

 template: audit_lost_events
       on: audit.lost
    class: Errors
     type: System
component: Audit
   lookup: max -1m unaligned of lost
    units: events/s
    every: 10s
     warn: $this > 1000000
     crit: $this > 1000000
    delay: down 5m multiplier 1.5 max 1h
  summary: Audit subsystem losing events (silenced during container bursts)
     info: Linux audit subsystem transient burst silenced
       to: silent
