# @source https://github.com/lukevella/rallly/blob/main/docker-compose.yml
services:
  rallly_db:
    image: postgres:14.2@sha256:2c954f8c5d03da58f8b82645b783b56c1135df17e650b186b296fa1bb71f9cfd
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - POSTGRES_DB=rallly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rallly_selfhosted:
    build:
      args:
        - SELF_HOSTED=true
      context: .
      dockerfile: ./apps/web/Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      rallly_db:
        condition: service_healthy
    ports:
      - 3000:3000
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@rallly_db/rallly
    env_file:
      - .env

volumes:
  db-data:
    driver: local
