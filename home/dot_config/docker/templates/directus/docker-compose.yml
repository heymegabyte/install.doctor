services:
  directus:
    image: directus/directus@sha256:e1561b5e526e8e7a2ac19b7bb6eab63611dd84a862a8c45b864118768a2baff4
    init: true
    restart: unless-stopped
    ports:
      - "8055:8055"
    environment:
      DIRECTUS_ADMIN_EMAIL: "${DIRECTUS_ADMIN_EMAIL:?set DIRECTUS_ADMIN_EMAIL}"
      DIRECTUS_ADMIN_PASSWORD: "${DIRECTUS_ADMIN_PASSWORD:?set DIRECTUS_ADMIN_PASSWORD}"
      DIRECTUS_KEY: "${DIRECTUS_KEY:?set DIRECTUS_KEY}"
      DIRECTUS_SECRET: "${DIRECTUS_SECRET:?set DIRECTUS_SECRET}"
      DB_CLIENT: "sqlite"
      DB_FILENAME: "/directus/database/data.db"
    volumes:
      - ./database:/directus/database
      - ./uploads:/directus/uploads
      - ./extensions:/directus/extensions
