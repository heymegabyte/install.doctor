# Canonical Scoped Coolify Sudoers Policy on Workstations (Item 27, sudo-rs compatible)
coolify ALL=(ALL) NOPASSWD: /usr/bin/docker, /usr/libexec/docker/cli-plugins/docker-compose, /usr/bin/docker-compose, /usr/bin/mkdir, /usr/bin/chown, /usr/bin/chmod, /usr/bin/rm, /usr/bin/cp, /usr/bin/mv, /usr/bin/cat, /usr/bin/tee, /usr/bin/stat, /usr/bin/ls, /usr/bin/find, /usr/bin/df, /usr/bin/du, /usr/bin/tar, /usr/bin/gzip, /usr/bin/systemctl, /usr/sbin/ufw, /usr/bin/journalctl, /usr/bin/uname, /usr/bin/hostname, /usr/bin/id, /usr/bin/whoami, /usr/bin/sh, /usr/bin/bash
