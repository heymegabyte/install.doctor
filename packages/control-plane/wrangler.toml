# aid control plane — Phase A skeleton (docs/aid/MASTER-PROMPT.md §2, §8, §17).
# account_id is read from the CLOUDFLARE_ACCOUNT_ID env at deploy time (never hardcoded).
# workers_dev = true keeps the *.workers.dev URL live (no custom domain yet).
name = "aid-control-plane"
main = "src/index.ts"
compatibility_date = "2026-05-01"
# nodejs_compat — required by Better Auth (O-series sign-in, fire #102): it uses node:crypto + friends.
compatibility_flags = ["nodejs_compat"]
workers_dev = true
migrations_dir = "migrations"

# Custom domain: app.install.doctor (zone 41d899… active in-account). CF provisions proxied DNS + TLS.
# workers_dev stays true so the *.workers.dev URL keeps serving during propagation
# (cloudflare-native-provisioning: declaring routes would otherwise default workers_dev=false).
routes = [{ pattern = "app.install.doctor", custom_domain = true }]

# D13 — validate the software catalog BEFORE every build/deploy (fire #134). wrangler runs this build
# command from this directory (packages/control-plane) prior to bundling `main`; a catalog conflict (two
# entries sharing a bin on an OVERLAPPING platform, providers != pkgs keys, bad installMode, missing fields)
# makes validate-catalog.py exit non-zero and ABORTS `wrangler deploy` (and `--dry-run`), so an invalid
# catalog can never ship. The detector itself is fixture-proven by scripts/test-catalog-integrity.sh.
[build]
command = "python3 ../../scripts/validate-catalog.py src/catalog.json"

# Persistence: authoritative stored blueprints (one "current" row per tenant). The DB index is a
# projection of ENVIRONMENT.md, not a competing authority (MASTER-PROMPT §9). Provisioned fire #13.
[[d1_databases]]
binding = "DB"
database_name = "aid-control-plane"
database_id = "7ccce515-05da-4561-b0f4-a8fce09062c7"
