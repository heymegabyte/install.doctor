name: "Site: Compress Images"

on:
  pull_request:
    paths:
      - "site/**.jpg"
      - "site/**.jpeg"
      - "site/**.png"
      - "site/**.webp"
  push:
    branches:
      - master
      - main
    paths:
      - "site/**.jpg"
      - "site/**.jpeg"
      - "site/**.png"
      - "site/**.webp"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  compress:
    name: Compress site images
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compress Images
        id: calibre
        uses: calibreapp/image-actions@9d037c06280028c110ff61c433ad4dc7d33c3c43 # 1.5.0
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          compressOnly: ${{ github.event_name != 'pull_request' }}

      - name: Create Pull Request
        if: |
          github.event_name != 'pull_request' &&
          steps.calibre.outputs.markdown != ''
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          title: "site: auto-compress images"
          branch-suffix: timestamp
          commit-message: "site: compress images"
          body: ${{ steps.calibre.outputs.markdown }}
