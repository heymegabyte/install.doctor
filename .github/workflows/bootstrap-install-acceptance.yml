name: Signed bootstrap acceptance

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-signed-start:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: |
            packages/aid-core/package-lock.json
            packages/control-plane/package-lock.json
            packages/installer-engine/package-lock.json
      - name: Install locked build dependencies
        run: |
          npm --prefix packages/aid-core ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/control-plane ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/installer-engine ci --ignore-scripts --no-audit --no-fund
      - name: Acquire pinned disposable image
        run: docker pull node@sha256:8fa96264f302f58bbb13aa7339c541547b56975766ce956c875da149452a3e40
      - name: Verify immutable publication and activation contracts
        run: node --test packages/control-plane/test/release-publication.test.mjs packages/control-plane/test/r2-publication-storage.test.mjs
      - name: Verify signed lifecycle gate covers every source commit
        run: bash scripts/test-bootstrap-acceptance-workflow.sh
      - name: Verify protected production release authority boundaries
        run: bash scripts/test-bootstrap-release-workflow.sh
      - name: Acquire the exact pinned OpenCode acceptance runtime
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/desktop-tools-opencode-acceptance"
          mkdir -m 700 "$root"
          url="$(jq -er '.artifacts.linux_x64.upstreamUrl' config/desktop-tools-opencode.lock.json)"
          digest="$(jq -er '.artifacts.linux_x64.sha256' config/desktop-tools-opencode.lock.json)"
          size="$(jq -er '.artifacts.linux_x64.size' config/desktop-tools-opencode.lock.json)"
          archive="$root/opencode.tar.gz"
          curl --fail --silent --show-error --location --max-redirs 3 --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --max-time 300 --retry 3 --retry-all-errors \
            --max-filesize 167772160 --output "$archive" "$url"
          test "$(wc -c < "$archive" | tr -d '[:space:]')" = "$size"
          printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --strict
          tar -tzf "$archive" | awk '/(^\/|(^|\/)\.\.($|\/))/ { exit 1 } END { if (NR < 1 || NR > 32) exit 1 }'
          tar --no-same-owner --no-same-permissions -xzf "$archive" -C "$root"
          runtime="$(find "$root" -type f -name opencode -perm -u+x -print)"
          test -n "$runtime" && test "$(printf '%s\n' "$runtime" | wc -l | tr -d '[:space:]')" = 1
          "$runtime" --version | grep -Fq "$(jq -er .version config/desktop-tools-opencode.lock.json)"
          printf 'OPENCODE_PINNED_BINARY=%s\n' "$runtime" >> "$GITHUB_ENV"
      - name: Verify typed agent-to-engine authority and evidence boundaries
        run: |
          npm --prefix packages/installer-engine run bundle
          node --test \
            packages/installer-engine/test/typed-tool-adapters.test.mjs \
            packages/installer-engine/test/mcp-server.test.mjs \
            packages/installer-engine/test/provisioning-prompt.test.mjs \
            packages/installer-engine/test/session-events.test.mjs \
            packages/installer-engine/test/deprovision-plan.test.mjs \
            packages/installer-engine/test/deprovision-lifecycle-canary.test.mjs
      - name: Verify signed start, clean install, and unchanged run
        run: bash scripts/test-bootstrap-install-acceptance.sh
      - name: Verify signed release upgrade and unchanged upgraded run
        run: bash scripts/test-bootstrap-upgrade-acceptance.sh

  linux-offline-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: |
            packages/aid-core/package-lock.json
            packages/control-plane/package-lock.json
            packages/installer-engine/package-lock.json
      - name: Install locked engine and Bubblewrap
        run: |
          npm --prefix packages/aid-core ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/control-plane ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/installer-engine ci --ignore-scripts --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Require real network-denied sandbox execution
        env:
          INSTALL_DOCTOR_REQUIRE_REAL_OFFLINE_SANDBOX: "1"
        run: |
          npm --prefix packages/installer-engine run build
          node --test \
            packages/installer-engine/test/profile-export-parity.test.mjs \
            packages/installer-engine/test/offline-sandbox.test.mjs \
            packages/installer-engine/test/offline-bundle.test.mjs \
            packages/installer-engine/test/offline-execution.test.mjs

  macos-signed-lifecycle:
    name: Native macOS signed fixture lifecycle — ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - osMajor: "26"
            architecture: arm64
            runner: macos-26
          - osMajor: "26"
            architecture: x64
            runner: macos-26-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: |
            packages/aid-core/package-lock.json
            packages/control-plane/package-lock.json
            packages/installer-engine/package-lock.json
      - name: Install locked release-build dependencies
        run: |
          npm --prefix packages/aid-core ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/control-plane ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/installer-engine ci --ignore-scripts --no-audit --no-fund
      - name: Verify native macOS signed lifecycle fixture (not platform promotion or canonical /start transport proof)
        env:
          INSTALL_DOCTOR_EXPECTED_MACOS_MAJOR: ${{ matrix.osMajor }}
        run: |
          bash scripts/test-bootstrap-macos-lifecycle-contract.sh
          INSTALL_DOCTOR_RUN_NATIVE_MACOS_LIFECYCLE=1 bash scripts/test-bootstrap-macos-lifecycle-acceptance.sh
