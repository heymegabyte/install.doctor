name: "Deploy Site Preview on PR"

on:
  pull_request:
    paths:
      - "site/**"

jobs:
  build_and_preview:
    if: "${{ github.event.pull_request.head.repo.full_name == github.repository }}"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install shdoc
        run: |
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --location --max-time 30 \
            https://github.com/reconquest/shdoc/releases/download/v1.1/shdoc -o "$tmp"
          test "$(wc -c < "$tmp" | tr -d ' ')" = 11466
          echo '3bda94dbe6efb789c8c5349e0d554c8f7841611ee0ff2c34a757541262d1c033  '"$tmp" | sha256sum --check --status
          sudo install -m 0755 "$tmp" /usr/local/bin/shdoc

      - name: Install and build
        run: npm ci --force && npm run build:prod

      - name: Deploy preview to Firebase
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_INSTALL_DOCTOR }}"
          projectId: install-doctor
          entryPoint: site
