name: "Validate Site on PR"

on:
  pull_request:
    paths:
      - "site/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install documentation generators
        run: |
          tmp="$(mktemp)"
          task_tmp_dir="$(mktemp -d)"
          trap 'rm -f "$tmp"; rm -rf "$task_tmp_dir"' EXIT
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --location --max-time 30 \
            https://github.com/reconquest/shdoc/releases/download/v1.1/shdoc -o "$tmp"
          test "$(wc -c < "$tmp" | tr -d ' ')" = 11466
          echo '3bda94dbe6efb789c8c5349e0d554c8f7841611ee0ff2c34a757541262d1c033  '"$tmp" | sha256sum --check --status
          sudo install -m 0755 "$tmp" /usr/local/bin/shdoc
          source ../scripts/lib/task-bootstrap.sh
          install_pinned_task linux "$(uname -m)" "$task_tmp_dir/task"
          sudo install -m 0755 "$task_tmp_dir/task" /usr/local/bin/task

      - name: Install and build
        run: npm ci --force && npm run build:prod

      - name: Verify build output without deployment
        run: test -s www/index.html
