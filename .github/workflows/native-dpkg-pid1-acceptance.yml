name: Native dpkg PID1 acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - packages/installer-engine/**
      - scripts/run-native-dpkg-pid1-acceptance.sh
      - scripts/test-native-dpkg-pid1-acceptance-contract.sh
      - .github/workflows/native-dpkg-pid1-acceptance.yml
  push:
    branches: [master]
    paths:
      - packages/installer-engine/**
      - scripts/run-native-dpkg-pid1-acceptance.sh
      - scripts/test-native-dpkg-pid1-acceptance-contract.sh
      - .github/workflows/native-dpkg-pid1-acceptance.yml

permissions:
  contents: read

concurrency:
  group: native-dpkg-pid1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debian-bookworm-systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/aid-core/package-lock.json
            packages/installer-engine/package-lock.json
      - name: Build exact fixture subject
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix packages/aid-core ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/installer-engine ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/installer-engine run build
      - name: Verify fixture contract
        run: |
          bash scripts/test-native-dpkg-pid1-acceptance-contract.sh
          node --test packages/installer-engine/test/release-native-authority.test.mjs
      - name: Run network-denied Debian PID1 acceptance
        env:
          INSTALL_DOCTOR_PID1_EVIDENCE_ROOT: ${{ runner.temp }}/native-dpkg-pid1
        run: bash scripts/run-native-dpkg-pid1-acceptance.sh
      - name: Upload machine-verifiable evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-dpkg-pid1-${{ github.run_id }}
          path: ${{ runner.temp }}/native-dpkg-pid1
          if-no-files-found: error
          retention-days: 14
