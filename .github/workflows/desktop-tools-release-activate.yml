name: Activate Desktop Tools release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Exact published Desktop Tools release ID
        required: true
        type: string
      channel:
        description: Product-qualified channel
        required: true
        default: canary
        type: choice
        options: [canary, stable]
      expected_channel_etag:
        description: Exact current ETag or - for first activation
        required: true
        type: string

permissions: {}
concurrency:
  group: desktop-tools-release-activate-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_id: ${{ steps.identity.outputs.release_id }}
      signer_id: ${{ steps.identity.outputs.signer_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: identity
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          SIGNER_ID: ${{ vars.DESKTOP_TOOLS_RELEASE_SIGNER_ID }}
        run: |
          set -euo pipefail
          case "$RELEASE_ID" in ''|[!a-z0-9]*|*[!a-z0-9._-]*) exit 64;; esac
          case "$SIGNER_ID" in desktop-*) ;; *) exit 64;; esac
          printf 'release_id=%s\nsigner_id=%s\n' "$RELEASE_ID" "$SIGNER_ID" >>"$GITHUB_OUTPUT"
      - name: Assemble source-pinned activation tools
        env:
          SIGNER_ID: ${{ steps.identity.outputs.signer_id }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p activation-tools/scripts activation-tools/src
          cp packages/control-plane/package.json packages/control-plane/package-lock.json activation-tools/
          cp packages/control-plane/scripts/*.mjs activation-tools/scripts/
          cp packages/control-plane/src/release-policy.ts activation-tools/src/
          npm --prefix activation-tools ci --omit=dev --ignore-scripts --no-audit --no-fund
          jq -er --arg id "$SIGNER_ID" '.products["desktop-tools"].signers[$id]' packages/control-plane/src/release-trust.json >activation-tools/release-public-key
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-tools-activation-tools-${{ github.run_id }}
          path: activation-tools
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  activate:
    name: CAS-activate exact Desktop Tools release
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: desktop-tools-release-activate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-tools-activation-tools-${{ github.run_id }}
          path: activation-tools
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_DESKTOP_TOOLS_RELEASE_ACTIVATOR_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /ci/desktop-tools/release/activator
          include-imports: false
          recursive: false
      - name: Activate by compare-and-swap
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          CHANNEL: ${{ inputs.channel }}
          EXPECTED_ETAG: ${{ inputs.expected_channel_etag }}
          DESKTOP_TOOLS_RELEASE_SIGNER_ID: ${{ needs.prepare.outputs.signer_id }}
          DESKTOP_TOOLS_RELEASE_PUBLIC_KEY: ${{ github.workspace }}/activation-tools/release-public-key
        run: |
          set -euo pipefail
          if [ "$EXPECTED_ETAG" != - ] && [[ ! "$EXPECTED_ETAG" =~ ^\"[A-Za-z0-9._:-]+\"$ ]]; then exit 64; fi
          activation_id="$(node -e 'process.stdout.write(crypto.randomUUID())')"
          activated_at="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          set +e
          output="$(node activation-tools/scripts/publish-release-to-r2.mjs desktop-activate "$RELEASE_ID" "$CHANNEL" "$EXPECTED_ETAG" "$activation_id" "$activated_at")"; status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 75 ]; then
            node activation-tools/scripts/publish-release-to-r2.mjs desktop-reconcile "$CHANNEL" "$activation_id"
          elif [ "$status" -ne 0 ]; then exit "$status"; fi
          printf 'DESKTOP_TOOLS_RELEASE_R2_ACCESS_KEY_ID=\nDESKTOP_TOOLS_RELEASE_R2_SECRET_ACCESS_KEY=\nDESKTOP_TOOLS_CHANNEL_R2_ACCESS_KEY_ID=\nDESKTOP_TOOLS_CHANNEL_R2_SECRET_ACCESS_KEY=\n' >>"$GITHUB_ENV"
