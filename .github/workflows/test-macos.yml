name: Test Install Doctor on macOS

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "site/**"
  pull_request:
    paths-ignore:
      - "site/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: "Structural checks — macOS ${{ matrix.osMajor }} ${{ matrix.architecture }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - osMajor: "15"
            architecture: arm64
            unameArchitecture: arm64
            runner: macos-15
          - osMajor: "15"
            architecture: x64
            unameArchitecture: x86_64
            runner: macos-15-intel

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: |
            packages/aid-core/package-lock.json
            packages/installer-engine/package-lock.json
            packages/control-plane/package-lock.json

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.13.11

      - name: Install pinned test prerequisites
        run: |
          brew install ripgrep shellcheck
          python3 -m venv "$RUNNER_TEMP/install-doctor-test-python"
          "$RUNNER_TEMP/install-doctor-test-python/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: PyYAML==6.0.3
          printf '%s\n' "$RUNNER_TEMP/install-doctor-test-python/bin" >> "$GITHUB_PATH"
          npm --prefix packages/aid-core ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/installer-engine ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/control-plane ci --ignore-scripts --no-audit --no-fund

      - name: Assert observed platform tuple
        env:
          EXPECTED_OS_MAJOR: ${{ matrix.osMajor }}
          EXPECTED_UNAME_ARCHITECTURE: ${{ matrix.unameArchitecture }}
        run: |
          set -euo pipefail
          observed_version="$(sw_vers -productVersion)"
          observed_major="${observed_version%%.*}"
          observed_architecture="$(uname -m)"
          if ! [ "$observed_major" = "$EXPECTED_OS_MAJOR" ]; then
            printf '::error::Runner OS mismatch: expected macOS major %s, observed %s (%s)\n' \
              "$EXPECTED_OS_MAJOR" "$observed_major" "$observed_version"
            exit 1
          fi
          if ! [ "$observed_architecture" = "$EXPECTED_UNAME_ARCHITECTURE" ]; then
            printf '::error::Runner architecture mismatch: expected %s, observed %s\n' \
              "$EXPECTED_UNAME_ARCHITECTURE" "$observed_architecture"
            exit 1
          fi
          printf 'Verified runner tuple: macOS %s / %s\n' "$observed_major" "$observed_architecture"

      - name: Print System Information
        run: |
          echo "=== macOS System Information ==="
          sw_vers
          uname -a
          sysctl -n machdep.cpu.brand_string
          echo "Architecture: $(uname -m)"
          echo "Disk space:"
          df -h /
          echo "Available memory:"
          sysctl -n hw.memsize | awk '{print $0/1024/1024/1024 " GB"}'
          echo ""

      - name: Test detect_os library
        run: |
          bash scripts/test-detect-os.sh

      - name: Run full test suite at CI parity (blocking)
        run: bash scripts/test-all.sh

      - name: "Best-effort checked-out platform admission — macOS ${{ matrix.osMajor }} ${{ matrix.architecture }} (not signed lifecycle proof)"
        env:
          EXPECTED_CELL: macos-${{ matrix.osMajor }}-${{ matrix.architecture }}-native
        run: |
          # Full installation requires a signed release closure and belongs to
          # the dedicated lifecycle acceptance workflow. This job proves only
          # that the checked-out policy admits the exact observed native tuple.
          bash -c '
            set -eo pipefail
            source scripts/provision.sh
            export CI=true TEST_INSTALL=true HEADLESS_INSTALL=true NO_RESTART=true SOFTWARE_GROUP=Basic
            export INSTALL_DOCTOR_CONSENT_PRIVILEGED=true INSTALL_DOCTOR_CONSENT_NETWORK=true
            export INSTALL_DOCTOR_CONSENT_BEST_EFFORT=true INSTALL_DOCTOR_USER="$USER"
            setEnvironmentVariables
            setCIEnvironmentVariables
            applyEnvClassDefaults
            idResolvePlatform
            idAuthorizePlatform
            [ "$INSTALL_DOCTOR_PLATFORM_CELL" = "$EXPECTED_CELL" ]
          '

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-logs-${{ matrix.runner }}
          path: |
            macos-script.log
            ${{ github.workspace }}/.local/var/log/install.doctor/
          retention-days: 7
