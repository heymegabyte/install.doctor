name: Test Install Doctor on Linux

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "site/**"
  pull_request:
    paths-ignore:
      - "site/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # ShellCheck lint — fast, runs first, blocks on new violations only
  # ============================================================================
  lint-shell:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint core scripts (blocking)
        run: |
          shellcheck -x scripts/provision.sh start.sh || {
            echo "::error::ShellCheck failed on core scripts — fix before merge"
            exit 1
          }

      - name: Lint all scripts (advisory)
        continue-on-error: true
        run: |
          find . -name "*.sh" -not -path "*/.git/*" -not -path "*/.claude/worktrees/*" \
            -exec shellcheck -x {} \; 2>&1 | tee shellcheck.log
          VIOLATIONS=$(grep -c "SC\|warning\|error" shellcheck.log || true)
          echo "ShellCheck violations (existing): $VIOLATIONS"
          echo "shellcheck_violations=$VIOLATIONS" >> "$GITHUB_OUTPUT"

      - name: Audit deprecated packages
        run: bash scripts/audit-deprecated.sh

      - name: Generate SBOM
        run: |
          bash scripts/generate-sbom.sh --compact > sbom.json
          echo "SBOM generated: $(wc -c < sbom.json) bytes"
          echo "Components: $(python3 -c "import json; d=json.load(open('sbom.json')); print(len(d['components']))" 2>/dev/null || echo "N/A")"

      - name: Check template drift (provision.sh vs provision.sh.tmpl)
        run: |
          if [ -f scripts/src/provision.sh.tmpl ]; then
            TMPL_LINES=$(wc -l < scripts/src/provision.sh.tmpl | tr -d ' ')
            LIVE_LINES=$(wc -l < scripts/provision.sh | tr -d ' ')
            DELTA=$((LIVE_LINES - TMPL_LINES))
            echo "Template: $TMPL_LINES lines, Live: $LIVE_LINES lines, Delta: $DELTA"
            if [ "$DELTA" -gt 50 ]; then
              echo "::warning::Template drift: provision.sh has $DELTA more lines than provision.sh.tmpl (threshold: 50)"
            elif [ "$DELTA" -lt 0 ]; then
              echo "::error::Template has MORE lines than live — likely regression"
              exit 1
            else
              echo "Template drift within bounds ($DELTA lines)"
            fi
          fi

      - name: Check for source drift
        run: |
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::error::Source drift detected — uncommitted changes in chezmoi source"
            git diff --stat
            exit 1
          fi
          echo "Source drift: CLEAN"
  # ============================================================================
  # Native container tests - fast, no QEMU overhead
  # Tests the bootstrap script directly in each distro's container
  # ============================================================================
  test-container:
    name: "${{ matrix.distro }} (container)"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-22.04
            image: ubuntu:22.04
          - distro: ubuntu-24.04
            image: ubuntu:24.04
          - distro: debian-12
            image: debian:12
          - distro: fedora-39
            image: fedora:39
          - distro: fedora-40
            image: fedora:40
          - distro: centos-stream-9
            image: quay.io/centos/centos:stream9
          - distro: archlinux
            image: archlinux:latest
          - distro: alpine-3.19
            image: alpine:3.19
          - distro: opensuse-leap
            image: opensuse/leap:15.5

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install prerequisites (Debian/Ubuntu)
        if: contains(matrix.distro, 'ubuntu') || contains(matrix.distro, 'debian')
        run: |
          apt-get update
          apt-get install -y curl bash sudo

      - name: Install prerequisites (Fedora)
        if: contains(matrix.distro, 'fedora')
        run: |
          dnf install -y curl bash sudo

      - name: Install prerequisites (CentOS)
        if: contains(matrix.distro, 'centos')
        run: |
          dnf install -y curl bash sudo

      - name: Install prerequisites (Archlinux)
        if: contains(matrix.distro, 'archlinux')
        run: |
          pacman -Sy --noconfirm curl bash sudo

      - name: Install prerequisites (Alpine)
        if: contains(matrix.distro, 'alpine')
        run: |
          apk add --update curl bash sudo shadow

      - name: Install prerequisites (OpenSUSE)
        if: contains(matrix.distro, 'opensuse')
        run: |
          zypper install -y curl bash sudo

      - name: Create non-root user
        run: |
          if command -v useradd > /dev/null; then
            useradd -m -s /bin/bash testuser || true
          elif command -v adduser > /dev/null; then
            adduser -D -s /bin/bash testuser || true
          fi
          echo "testuser ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

      - name: Validate software.yml schema
        run: bash scripts/validate-software-yml.sh

      - name: Test template rendering
        run: bash scripts/test-templates.sh

      - name: Test detect_os library
        run: |
          bash scripts/test-detect-os.sh

      - name: Run full test suite at CI parity (report-only — promote to blocking after a green CI run, #354)
        env:
          CONTROL_PLANE_URL: https://app.install.doctor
        run: bash scripts/test-all.sh || echo "::warning::test-all.sh reported failures (report-only; see log). Promote to blocking once CI parity is confirmed green."

      - name: Run Install Doctor bootstrap (headless)
        run: |
          su - testuser -c '
            export CI=true
            export TEST_INSTALL=true
            export HEADLESS_INSTALL=true
            export NO_RESTART=true
            export SOFTWARE_GROUP=Basic
            bash <(curl -sSL https://install.doctor/start)
          '
        timeout-minutes: 60

      - name: Verify key tools installed
        run: |
          su - testuser -c '
            echo "=== Verification ==="
            command -v chezmoi && echo "chezmoi: OK" || echo "chezmoi: MISSING"
            command -v brew && echo "brew: OK" || echo "brew: MISSING"
            command -v task && echo "task: OK" || echo "task: MISSING"
            command -v node && echo "node: OK" || echo "node: MISSING"
            echo "=== Done ==="
          '

  # ============================================================================
  # QEMU VM tests - full OS with systemd, networking, etc.
  # More realistic but slower than container tests
  # ============================================================================
  test-vm:
    name: "${{ matrix.distro }} (VM)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, debian, fedora, centos, arch]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install QEMU and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils genisoimage wget netcat-openbsd

      - name: Make Script Executable
        run: chmod +x scripts/test-linux.sh

      - name: Run ${{ matrix.distro }} VM and Execute Install Doctor
        run: |
          scripts/test-linux.sh ${{ matrix.distro }} "bash <(curl -sSL https://install.doctor/start)"
        timeout-minutes: 90

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-logs-${{ matrix.distro }}
          path: |
            run-vm.log
            run-vm-error.log
          retention-days: 7
