name: Test Install Doctor on Linux

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "site/**"
  pull_request:
    paths-ignore:
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural-contracts:
    name: Repository structural contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install structural-test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep rsync shellcheck

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: |
            packages/aid-core/package-lock.json
            packages/installer-engine/package-lock.json
            packages/control-plane/package-lock.json

      - name: Install locked test dependencies
        run: |
          npm --prefix packages/aid-core ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/installer-engine ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/control-plane ci --ignore-scripts --no-audit --no-fund

      - name: Lint core scripts
        run: shellcheck --severity=error -x scripts/provision.sh start.sh

      - name: Enforce shipped-shell quality ratchet
        run: bash scripts/test-shellcheck-quality.sh

      - name: Verify repository structural contracts
        run: bash scripts/test-all.sh

      - name: Audit deprecated packages
        run: bash scripts/audit-deprecated.sh

      - name: Generate structural SBOM
        run: |
          bash scripts/generate-sbom.sh --compact > sbom.json
          printf 'SBOM bytes: %s\n' "$(wc -c < sbom.json)"

      - name: Check bootstrap source authority
        run: bash scripts/test-bootstrap-source-authority.sh

      - name: Reject generated source drift
        run: |
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::error::Structural checks changed tracked source"
            git diff --stat
            exit 1
          fi

  # These jobs are definition-level, best-effort smoke evidence only. They do
  # not exercise the signed /start lifecycle and cannot promote matrix cells to
  # verified. Full signed lifecycle evidence is owned by the dedicated
  # bootstrap acceptance and real-host canary workflows.
  test-container:
    name: "Structural checks — ${{ matrix.cell }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: ubuntu-22-04-x64-container
            image: ubuntu:22.04@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
            osId: ubuntu
            version: "22.04"
            architecture: x86_64
            role: ubuntu
          - cell: ubuntu-24-04-x64-container
            image: ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
            osId: ubuntu
            version: "24.04"
            architecture: x86_64
            role: ubuntu
          - cell: debian-12-x64-container
            image: debian:12@sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8
            osId: debian
            version: "12"
            architecture: x86_64
            role: debian
          - cell: fedora-44-x64-container
            image: fedora:44@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e
            osId: fedora
            version: "44"
            architecture: x86_64
            role: fedora
          - cell: arch-rolling-x64-container
            image: archlinux@sha256:b1c2fe6e717bfd5673af8fc217e1e1c3ce0dcbb1d53c3414c8425e7ce79fc6d9
            osId: arch
            version: rolling
            architecture: x86_64
            role: arch
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned system Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2

      - name: Expose the selected runtime to the isolated login user
        run: |
          install -m 0755 "$(command -v node)" /usr/local/bin/node
          [ "$(/usr/local/bin/node --version)" = v24.22.2 ]

      - name: Assert observed container tuple
        shell: bash
        env:
          EXPECTED_OS_ID: ${{ matrix.osId }}
          EXPECTED_VERSION: ${{ matrix.version }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          [ -f /.dockerenv ]
          [ -r /etc/os-release ]
          # os-release is a shell-compatible, distribution-owned data file.
          # shellcheck disable=SC1091
          . /etc/os-release
          observed_id="${ID:-}"
          observed_version="${VERSION_ID:-}"
          observed_architecture="$(uname -m)"
          if [ "$EXPECTED_VERSION" = rolling ]; then
            observed_build="${BUILD_ID:-}"
            [ -n "$observed_build" ]
            printf 'Observed rolling build: %s\n' "$observed_build"
            observed_version=rolling
          fi
          [ "$observed_id" = "$EXPECTED_OS_ID" ]
          [ "$observed_version" = "$EXPECTED_VERSION" ]
          [ "$observed_architecture" = "$EXPECTED_ARCHITECTURE" ]
          printf 'Observed tuple: %s/%s/%s/container\n' "$observed_id" "$observed_version" "$observed_architecture"

      - name: Install smoke-test prerequisites (apt)
        if: matrix.osId == 'ubuntu' || matrix.osId == 'debian'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends bash curl jq sudo

      - name: Install smoke-test prerequisites (dnf)
        if: matrix.osId == 'fedora'
        run: dnf install -y bash curl jq sudo shadow-utils util-linux

      - name: Install smoke-test prerequisites (pacman)
        if: matrix.osId == 'arch'
        run: pacman -Sy --noconfirm bash curl jq sudo shadow

      - name: Assert support-matrix admission
        env:
          EXPECTED_CELL: ${{ matrix.cell }}
          EXPECTED_ROLE: ${{ matrix.role }}
        run: |
          # jq variables are intentionally referenced inside its single-quoted program.
          # shellcheck disable=SC2016
          jq -e --arg id "$EXPECTED_CELL" --arg role "$EXPECTED_ROLE" '
            any(.cells[];
              .id == $id and
              .status == "best-effort" and
              .arch == "x64" and
              .environment == "container" and
              .role == $role)
          ' scripts/platform-support-matrix.json >/dev/null

      - name: Create isolated non-root smoke user
        run: |
          if command -v useradd >/dev/null 2>&1; then
            useradd -m -s /bin/bash testuser
          else
            adduser -D -s /bin/bash testuser
          fi
          printf 'testuser ALL=(ALL) NOPASSWD:ALL\n' >> /etc/sudoers
          [ "$(su - testuser -c 'node --version')" = v24.22.2 ]

      - name: "Best-effort checked-out platform admission — ${{ matrix.cell }} (not signed lifecycle proof)"
        env:
          EXPECTED_CELL: ${{ matrix.cell }}
          EXPECTED_ROLE: ${{ matrix.role }}
        run: |
          install -m 0755 scripts/provision.sh /tmp/install-doctor-provision.sh
          # Direct provision.sh execution now correctly rejects an unsigned,
          # engine-less checkout. Exercise only its read-only tuple admission
          # here; the dedicated signed acceptance workflow owns installation.
          bash -c '
            set -eo pipefail
            source /tmp/install-doctor-provision.sh
            export CI=true TEST_INSTALL=true HEADLESS_INSTALL=true NO_RESTART=true SOFTWARE_GROUP=Basic
            export INSTALL_DOCTOR_CONSENT_PRIVILEGED=true INSTALL_DOCTOR_CONSENT_NETWORK=true
            export INSTALL_DOCTOR_CONSENT_BEST_EFFORT=true INSTALL_DOCTOR_USER=testuser
            setEnvironmentVariables
            setCIEnvironmentVariables
            applyEnvClassDefaults
            idResolvePlatform
            idAuthorizePlatform
            [ "$INSTALL_DOCTOR_PLATFORM_CELL" = "$EXPECTED_CELL" ]
            [ "$INSTALL_DOCTOR_PLATFORM_ROLE" = "$EXPECTED_ROLE" ]
          '
